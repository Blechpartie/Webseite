[build]
  publish = "public"
  command = "bash scripts/version.sh"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    # Dateien tragen eine Version (?v=…), daher dürfen Browser sie lange behalten
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    # Dateien tragen eine Version (?v=…), daher dürfen Browser sie lange behalten
    Cache-Control = "public, max-age=31536000, immutable"
